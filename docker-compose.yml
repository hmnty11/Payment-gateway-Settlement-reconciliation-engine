 name: payment-recon
 services:
  minio:
    env_file:
    - .env
    image: quay.io/minio/minio
    container_name: minio-S3
    ports: 
    - "9000:9000"
    - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINI_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
    - ./minio/data:/data
    command: server /data --console-address ":9001"  