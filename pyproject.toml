[project]
name = "payment-recon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hmty11", email = "darrenjeho@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "apache-airflow>=3.3.2",
    "boto3>=1.43.118",
    "dbt-core>=1.12.5",
    "dbt-databricks>=1.12.7",
    "pandas>=3.1.0",
]

[project.scripts]
payment-gateway-settlement-reconciliation-engine = "payment_gateway_settlement_reconciliation_engine:main"

[build-system]
